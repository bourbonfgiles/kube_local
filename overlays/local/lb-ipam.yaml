# Must sit inside the k3d node network so the host can ARP for it.
# Check with: podman --url $DOCKER_HOST network inspect k3d-dev
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: local
spec:
  blocks:
    - start: 10.89.0.200
      stop: 10.89.0.250
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: local
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
