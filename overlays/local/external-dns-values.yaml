# Writes to the in-cluster BIND (overlays/local/dns) instead of Route53.
provider:
  name: rfc2136

txtOwnerId: k3d-dev
domainFilters:
  - kube.internal

extraArgs:
  - --rfc2136-host=bind.dns.svc.cluster.local.
  - --rfc2136-port=53
  - --rfc2136-zone=kube.internal
  - --rfc2136-tsig-keyname=externaldns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-axfr

env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: externaldns-tsig
        key: secret
