apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.18.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  # Single source of truth: bootstrap.sh helm-installs Cilium with this same
  # block (yq '.spec.values') so Flux adopts the release.
  values:
    kubeProxyReplacement: true
    k8sServiceHost: k3d-dev-serverlb
    k8sServicePort: 6443
    routingMode: tunnel
    tunnelProtocol: vxlan
    l2announcements:
      enabled: true
    gatewayAPI:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    bpf:
      monitorAggregation: none
    operator:
      replicas: 1
