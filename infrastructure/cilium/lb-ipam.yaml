apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  # Must sit inside the k3d Docker network so L2 announcements are reachable.
  # Verify with `docker network inspect k3d-dev` and adjust to that subnet.
  blocks:
    - cidr: 172.18.255.0/24
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
