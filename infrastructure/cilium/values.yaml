kubeProxyReplacement: true
k8sServiceHost: k3d-dev-serverlb
k8sServicePort: 6443

routingMode: tunnel
tunnelProtocol: vxlan

l2announcements:
  enabled: true

gatewayAPI:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

bpf:
  monitorAggregation: none

operator:
  replicas: 1
