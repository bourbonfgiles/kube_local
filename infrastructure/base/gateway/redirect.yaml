# ~/repos/personal/kube_local/infrastructure/base/gateway/redirect.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: web
      sectionName: http
  hostnames: ["*.${CLUSTER_DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
