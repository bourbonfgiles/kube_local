# ~/repos/personal/kube_local/infrastructure/base/monitoring/route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: web
      namespace: gateway
  hostnames: ["grafana.${CLUSTER_DOMAIN}"]
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
