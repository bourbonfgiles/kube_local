# ~/repos/personal/kube_local/infrastructure/base/flux-operator/route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
  namespace: flux-system
spec:
  parentRefs:
    - name: web
      namespace: gateway
  hostnames: ["flux.${CLUSTER_DOMAIN}"]
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
