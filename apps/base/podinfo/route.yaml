# ~/repos/personal/kube_local/apps/base/podinfo/route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
spec:
  parentRefs:
    - name: web
      namespace: gateway
  hostnames: [podinfo.${CLUSTER_DOMAIN}]
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
